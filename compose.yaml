services:
  api:
    build: ./backend
    env_file: backend/.env
    environment:
      DAISY_ENV: production
      DAISY_STATE_DB: /app/state/daisy.sqlite
      DAISY_MODEL_DIR: /app/artifacts
    volumes:
      - state:/app/state
      - artifacts:/app/artifacts
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  worker:
    build: ./backend
    command: ["python", "worker.py"]
    env_file: backend/.env
    environment:
      DAISY_ENV: production
      DAISY_STATE_DB: /app/state/daisy.sqlite
      DAISY_MODEL_DIR: /app/artifacts
    volumes:
      - state:/app/state
      - artifacts:/app/artifacts
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "worker.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "127.0.0.1:8443:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
volumes:
  state:
  artifacts:
