name: Validate DAISY

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    env:
      VITE_CONVEX_URL: https://ci-example.convex.cloud
      VITE_CONVEX_SITE_URL: https://ci-example.convex.site
      VITE_DAISY_API_URL: https://api.daisy.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:config
      - run: npx tsc -p convex/tsconfig.json --noEmit
      - run: npm run test:convex
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: pip check
      - run: pytest -q
